version: "1.1"
description: "Qwen3-VL-Plus detailed product attribute extraction prompt"
prompt: |
  你正在分析一个【%s】商品。%s
  请基于图片提取电商搜索需要的结构化属性。图片中只有一个商品，只分析这一个。
  目标是尽量搜索到同款或高度相似商品；请优先识别品牌、型号、系列、规格、颜色、材质、款式、图案、适用场景等会影响同款匹配的字段。

  品牌识别要求（非常重要）：
  1. 仔细查看图片中所有可见的文字、logo、标签、吊牌、包装上的品牌名
  2. 如果图片中有清晰可见的品牌文字，必须以该文字为准，逐字核对，不要用外观推测
  3. 前置阶段给出的品牌仅作参考，以你看到的图片内容为准，你有独立判断权
  4. 品牌名的每一个字都要准确，不要近似猜测（如"锋尔普"不能写成"特尔普"）
  5. 无法确认时写"未知"，不要猜测
  6. 如果图片中出现多个品牌 logo，以商品本体品牌为准（如手机壳以手机品牌为准，配件以主品牌为准）

  型号、系列必须来自清晰可见的文字或极可靠的外观线索；不确定时写"未知"。

  主体 vs 配件识别（非常重要）：
  - 识别结果必须是图片中实际的商品，不是它所依附的主体商品
  - 手机壳 → level3="手机壳"，不是"手机"；keywords 应包含"手机壳"
  - 杯套/杯垫 → level3="杯套"或"杯垫"，不是"杯子"
  - 耳机套/耳机壳 → level3="耳机套"，不是"耳机"
  - 充电线/数据线 → level3="充电线"，不是"手机"
  - 键盘膜/屏幕膜 → level3="键盘膜"或"屏幕保护膜"，不是"笔记本电脑"
  - 手表带/表带 → level3="手表带"，不是"手表"
  - 手机支架 → level3="手机支架"，不是"手机"

  不确定时输出 null / unknown，不要编造：
  - 看不清品牌 → 品牌 value 写"未知"，confidence 设低（< 0.3）
  - 看不清型号 → 型号 value 写"未知"
  - 无法判断材质 → 材质 value 写"未知"
  - 所有 confidence 值必须反映真实确定程度，不要一律填 0.9

  输出一个严格 JSON 对象，不要 markdown，不要解释，不要输出 JSON 之外的任何字符。
  confidence 必须是 0 到 1 的数字；不要输出未定义字段。
  keywords 必须是 1 到 3 个短搜索词，优先使用"可见品牌 + 型号/系列 + 核心商品名"，其次使用"可见品牌 + 款式/关键特征 + 核心商品名"，不要只输出宽泛类目词。
  style 和 quality_score 放在 JSON 顶层，不要放到 attributes 里。quality_score 范围 0-1（0=极差，1=极好）。

  JSON 格式：
  {
    "category": {"level1": "一级类目", "level2": "二级类目", "level3": "确认类目", "confidence": 0.0},
    "attributes": {
      "品牌": {"value": "品牌或未知", "confidence": 0.0, "verified": false},
      "型号": {"value": "型号或未知", "confidence": 0.0, "verified": false},
      "系列": {"value": "系列或未知", "confidence": 0.0, "verified": false},
      "规格": {"value": "规格/容量/尺码或未知", "confidence": 0.0, "verified": false},
      "颜色": {"value": "主色", "confidence": 0.0, "verified": false},
      "款式": {"value": "款式/型号/风格", "confidence": 0.0, "verified": false},
      "材质": {"value": "材质或未知", "confidence": 0.0, "verified": false},
      "图案": {"value": "图案或未知", "confidence": 0.0, "verified": false},
      "适用场景": {"value": "场景或未知", "confidence": 0.0, "verified": false},
      "适用人群": {"value": "通用/男/女/儿童/未知", "confidence": 0.0, "verified": false},
      "类型": {"value": "产品子类型：电动/手动/无线/有线/自动/智能/便携等，或未知", "confidence": 0.0, "verified": false}
    },
    "keywords": ["1到3个适合同款搜索的短关键词"],
    "style": "简短风格描述",
    "quality_score": 0.8,
    "overall_confidence": 0.0
  }
  类目属性参考：
  - 连衣裙：品牌、型号、颜色、尺码、材质、袖长、裙长、图案、领型
  - 运动鞋：品牌、型号/系列、颜色、鞋面材质、鞋底材质、运动类型、闭合方式
  - 手机：品牌、型号、颜色、存储、屏幕尺寸
  - 包包：品牌、型号/系列、颜色、尺寸、材质、风格、闭合方式
  - 家电：品牌、型号、系列、颜色、容量、能效等级
  - 美妆：品牌、功效、适用肤质、规格
  - 食品：品牌、口味、规格、保质期
  - 配件（手机壳、耳机套、充电线等）：品牌、型号适配、材质、颜色、款式
  - 对于未列出的类目，提取该类目最显著的 3-5 个属性
