version: "1.0"
description: "Semantic planner user prompt template"
prompt: |
  State stack rule:
  - The history below contains only previous successful user utterances.
  - Output the complete target state for this turn, not an incremental delta.
  - If the current utterance replaces an earlier constraint, output only the current intended constraint.
  - 最终状态可以同时包含多个筛选条件，不是只能识别一个条件。
  - 历史中的成功筛选默认属于当前状态；当前输入如果是新增条件，必须保留历史中不冲突的条件。
  - 只有用户明确说“现在要、改成、换成、不要、不限、取消、去掉”等，才替换或删除对应条件。
  - 同类硬条件冲突时，用当前输入替换历史条件；不同类型条件默认共存。
  - 完整目标状态只能由“对话历史中的用户话术”和“当前用户输入”组成。
  - 当前商品、类目、识别属性、候选商品标题不是用户筛选条件，不能自动写入 hard_filters。
  - attribute:<属性名> 必须能在对话历史或当前用户输入中找到明确来源；不要从“当前商品=有线鼠标”推导出“用户要有线”。
  - 示例：历史“预算100以内”，当前“再找适合学生党的” → 输出 price <= 100，并同时输出学生党/年轻用户相关偏好或判断。
  - 示例：历史“预算100以内”，当前“现在改成200以上的” → 输出 price >= 200，不保留 price <= 100。
  - 示例：历史“预算100以内”，当前“不限价格，只要适合学生党” → 不输出价格 hard filter，只输出学生党相关条件。
  - 示例：当前商品“有线鼠标”，历史“我要低于50的”，当前“我要比较适合年轻人的款式” → 输出 price <= 50 + 年轻人/外观偏好；禁止输出 attribute:类型=有线。
  - 示例：历史“预算50以内”，当前“有没有有线的” → 输出 price <= 50，并输出 {"field":"attribute:类型","operator":"equals","value":"有线"}。
  - 示例：历史“预算50以内；我要有线的”，当前“有没有适合年轻人的款式” → 输出 price <= 50 + attribute:类型=有线 + 年轻人/外观偏好。
  - 示例：历史“我要有线的”，当前“不要有线了，改成无线” → 输出 attribute:类型=无线，不保留 attribute:类型=有线。

  当前商品：%s
  类目：%s
  对话历史（最近几轮）：
  %s
  用户输入：%s

  请只输出一个严格 JSON 对象，不要输出 markdown，不要解释。
  输出格式：
  {
    "intent": "filter_current_results",
    "execution_mode": "STRICT_FILTER",
    "hard_filters": [],
    "semantic_filters": [],
    "preferences": [],
    "exclusions": [],
    "sort": null,
    "zero_result_policy": "KEEP_PREVIOUS_RESULTS",
    "criteria": [],
    "negative_criteria": [],
    "judge": null,
    "ranking_goal": null,
    "result_strategy": null
  }

  其中 hard_filters 每项格式：
  {"field": "price", "operator": "<=", "value": 100}
  客观商品属性 hard filter 格式：
  {"field": "attribute:类型", "operator": "equals", "value": "有线"}

  semantic_filters 每项格式：
  {"code": "airplane_allowed", "userMeaning": "可带上飞机", "matchLogic": "EVIDENCE_OR_SCORE"}

  preferences 每项格式：
  {"code": "cost_effective", "userMeaning": "性价比高", "weight": 0.8}

  exclusions 每项格式：
  {"code": "accessory", "userMeaning": "不要配件", "keywords": ["配件","手机壳"], "roles": ["accessory"]}

  sort 格式：
  {"field": "price", "order": "asc"}

  criteria 每项格式：
  {
    "name": "可带上飞机",
    "type": "evidence_or_score",
    "required": false,
    "weight": 0.8,
    "userMeaning": "可随身携带上飞机",
    "unknownPolicy": "KEEP_AS_SECONDARY",
    "signals": [
      {"kind": "keyword", "field": "all_text", "operator": "contains_any", "values": ["可登机", "民航允许"], "score": 0.95, "description": "明确标注可登机", "bucket": "EXPLICIT_MATCH"}
    ]
  }

  negative_criteria 每项格式：
  {"name": "户外电源", "action": "reject", "signals": [{"kind": "keyword", "field": "all_text", "operator": "contains_any", "values": ["户外电源", "220V", "AC输出"]}]}

  judge 格式：
  {
    "required": true,
    "userMeaning": "适合女生送礼",
    "positive_signals": ["礼盒", "外观精致", "品牌感", "评分高", "价格适中"],
    "negative_signals": ["配件", "替换装", "工业风", "廉价感"],
    "candidate_limit": 80,
    "return_limit": 50,
    "min_score": 0.35
  }

  ranking_goal 示例：
  "优先展示更适合作为礼物且不像配件的商品"
