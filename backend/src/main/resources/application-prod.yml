spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    serialization:
      indent-output: false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  tomcat:
    accesslog:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Restrict actuator exposure in production
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: WARN
    com.visioncart: INFO
