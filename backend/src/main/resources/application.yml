server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  tomcat:
    max-http-form-post-size: 30MB

spring:
  application:
    name: visioncart
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/visioncart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:visioncart}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: ${MYSQL_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1500ms
  # AI 配置说明：
  # spring.ai.openai.* 用于 Spring AI ChatClient.Builder 自动配置（NLP LLM 调用）
  # visioncart.ai.* 用于视觉模型和自定义配置（豆包 Vision API + 推理参数）
  # 两者共存是因为 Spring AI 框架要求 spring.ai.openai.* 前缀才能自动装配 ChatClient
  ai:
    openai:
      api-key: ${ARK_API_KEY:}
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      chat:
        options:
          model: ${ARK_LLM_MODEL:}
          temperature: 0
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

aliyun:
  bailian:
    api-key: ${ALIYUN_BAILIAN_API_KEY:}
    base-url: ${ALIYUN_BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

visioncart:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:604800000}
  ai:
    llm-model: ${ARK_LLM_MODEL:}
    vision-model: ${ARK_VISION_MODEL:}
    vision-api-key: ${ARK_VISION_API_KEY:}
    qwen-flash-model: ${QWEN_VL_FLASH_MODEL:qwen3-vl-flash}
    qwen-plus-model: ${QWEN_VL_PLUS_MODEL:qwen3-vl-plus}
    temperature: ${AI_TEMPERATURE:0.0}
    max-tokens: ${AI_MAX_TOKENS:}
    top-p: ${AI_TOP_P:}
    nlp-retry-count: ${AI_NLP_RETRY_COUNT:2}
    nlp-retry-base-delay-ms: ${AI_NLP_RETRY_BASE_DELAY_MS:1000}
  pdd:
    api-url: ${PDD_API_URL:https://gw-api.pinduoduo.com/api/router}
    client-id: ${PDD_CLIENT_ID:}
    client-secret: ${PDD_CLIENT_SECRET:}
    pid: ${PDD_PID:}
  taobao:
    api-url: ${TAOBAO_API_URL:https://eco.taobao.com/router/rest}
    app-key: ${TAOBAO_APP_KEY:}
    app-secret: ${TAOBAO_APP_SECRET:}
    adzone-id: ${TAOBAO_ADZONE_ID:}
  ebay:
    app-id: ${EBAY_APP_ID:}
    cert-id: ${EBAY_CERT_ID:}
    dev-id: ${EBAY_DEV_ID:}
    marketplace-id: ${EBAY_MARKETPLACE_ID:EBAY_US}
  search:
    platform-timeout-ms: ${SEARCH_PLATFORM_TIMEOUT_MS:8000}
    core-pool-size: ${SEARCH_CORE_POOL_SIZE:8}
    max-pool-size: ${SEARCH_MAX_POOL_SIZE:32}
    queue-capacity: ${SEARCH_QUEUE_CAPACITY:200}
  circuit-breaker:
    failure-threshold: ${CB_FAILURE_THRESHOLD:3}
    open-duration-ms: ${CB_OPEN_DURATION_MS:60000}
    half-open-probe-count: ${CB_HALF_OPEN_PROBE_COUNT:3}
    slow-call-threshold-ms: ${CB_SLOW_CALL_THRESHOLD_MS:5000}
    slow-call-rate-threshold: ${CB_SLOW_CALL_RATE_THRESHOLD:0.5}
  suggestion:
    session-ttl-minutes: ${SUGGESTION_SESSION_TTL_MINUTES:30}
    max-sessions: ${SUGGESTION_MAX_SESSIONS:10000}
  geoip:
    database-path: ${GEOIP_DATABASE_PATH:data/GeoLite2-Country.mmdb}
  price-monitor:
    enabled: ${PRICE_MONITOR_ENABLED:true}
    refresh-on-view: ${PRICE_MONITOR_REFRESH_ON_VIEW:true}
    scheduled-enabled: ${PRICE_MONITOR_SCHEDULED:true}
    max-products-per-run: ${PRICE_MONITOR_MAX_PRODUCTS:50}
    history-retention-days: ${PRICE_MONITOR_HISTORY_DAYS:90}
    notification-dedup-days: ${PRICE_MONITOR_DEDUP_DAYS:3}
  security:
    allowed-origins: ${VISIONCART_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    admin-user-ids: ${VISIONCART_ADMIN_USER_IDS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-limit: ${RATE_LIMIT_DEFAULT_LIMIT:120}
    default-window-seconds: ${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:60}
    auth-limit: ${RATE_LIMIT_AUTH_LIMIT:10}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:300}
    recognition-limit: ${RATE_LIMIT_RECOGNITION_LIMIT:20}
    recognition-window-seconds: ${RATE_LIMIT_RECOGNITION_WINDOW_SECONDS:3600}
    max-local-keys: ${RATE_LIMIT_MAX_LOCAL_KEYS:10000}
  recognition:
    max-upload-bytes: ${RECOGNITION_MAX_UPLOAD_BYTES:26214400}
    image-max-dimension: ${RECOGNITION_IMAGE_MAX_DIM:1024}
    image-jpeg-quality: ${RECOGNITION_IMAGE_JPEG_QUALITY:0.85}
    timeout-ms: ${RECOGNITION_TIMEOUT_MS:30000}
    retry-count: ${RECOGNITION_RETRY_COUNT:1}
    blur-threshold: ${RECOGNITION_BLUR_THRESHOLD:35.0}
    brightness-min: ${RECOGNITION_BRIGHTNESS_MIN:15}
    brightness-max: ${RECOGNITION_BRIGHTNESS_MAX:245}
    core-pool-size: ${RECOGNITION_CORE_POOL_SIZE:4}
    max-pool-size: ${RECOGNITION_MAX_POOL_SIZE:16}
    queue-capacity: ${RECOGNITION_QUEUE_CAPACITY:50}
    retry-base-delay-ms: ${RECOGNITION_RETRY_BASE_DELAY_MS:1000}
    multi-product-threshold: ${RECOGNITION_MULTI_PRODUCT_THRESHOLD:2}
    min-detection-confidence: ${RECOGNITION_MIN_DETECTION_CONFIDENCE:0.7}
    max-products: ${RECOGNITION_MAX_PRODUCTS:5}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: visioncart
