plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def apiBaseUrl = localProperties.getProperty("VISIONCART_API_BASE_URL", "http://10.0.2.2:8080/").trim()
def allowHttpRelease = localProperties.getProperty("VISIONCART_ALLOW_HTTP_RELEASE", "false").trim().toBoolean()
def allowedHttpReleaseHosts = localProperties.getProperty("VISIONCART_ALLOWED_HTTP_RELEASE_HOSTS", "")
        .split(",")
        .collect { it.trim() }
        .findAll { !it.isBlank() }
def releaseStoreFilePath = localProperties.getProperty("VISIONCART_RELEASE_STORE_FILE", "").trim()
def releaseStorePassword = localProperties.getProperty("VISIONCART_RELEASE_STORE_PASSWORD", "").trim()
def releaseKeyAlias = localProperties.getProperty("VISIONCART_RELEASE_KEY_ALIAS", "").trim()
def releaseKeyPassword = localProperties.getProperty("VISIONCART_RELEASE_KEY_PASSWORD", "").trim()
def hasReleaseSigning = releaseStoreFilePath &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

tasks.register("validateReleaseApiBaseUrl") {
    doLast {
        def uri = new URI(apiBaseUrl)
        def host = uri.host ?: ""
        def privateIp = host ==~ /^10\..*/ ||
                host ==~ /^192\.168\..*/ ||
                host ==~ /^172\.(1[6-9]|2[0-9]|3[01])\..*/
        def devHost = ["localhost", "127.0.0.1", "10.0.2.2"].contains(host) || privateIp
        def selfUseHttpAllowed = allowHttpRelease &&
                "http".equalsIgnoreCase(uri.scheme) &&
                allowedHttpReleaseHosts.contains(host)
        if (selfUseHttpAllowed) {
            return
        }
        if (!"https".equalsIgnoreCase(uri.scheme) || devHost) {
            throw new GradleException("Release builds require VISIONCART_API_BASE_URL to be HTTPS and not localhost/LAN, unless VISIONCART_ALLOW_HTTP_RELEASE is enabled for this host: ${apiBaseUrl}")
        }
    }
}

android {
    namespace "com.visioncart.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.visioncart.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.2.0"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

ksp {
    arg("room.generateKotlin", "true")
}

dependencies {
    // Compose BOM
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.8.9"

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    // CameraX
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"

    // Coil Image Loading
    implementation "io.coil-kt:coil-compose:2.7.0"

    // Network
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-moshi:2.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // WorkManager for scheduled tasks
    implementation "androidx.work:work-runtime-ktx:2.10.0"

    // DataStore (for simple preferences)
    implementation "androidx.datastore:datastore-preferences:1.1.4"

    // ExifInterface for image rotation
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // Encrypted SharedPreferences
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Unit Test
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0"
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn("validateReleaseApiBaseUrl")
    }
}
