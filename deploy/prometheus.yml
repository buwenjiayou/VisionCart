global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "visioncart-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["backend:8080"]
        labels:
          app: "visioncart"
          env: "compose"
    authorization:
      type: Bearer
      credentials: "__VISIONCART_MONITOR_TOKEN__"
