services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: visioncart
      MYSQL_USER: visioncart
      MYSQL_PASSWORD: visioncart
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mysql-data:
