services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: visioncart-backend
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      MYSQL_URL: ${DOCKER_MYSQL_URL:-jdbc:mysql://mysql:3306/visioncart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-visioncart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-visioncart}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - backend-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: visioncart-mysql
    environment:
      MYSQL_DATABASE: visioncart
      MYSQL_USER: ${MYSQL_USERNAME:-visioncart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-visioncart}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: visioncart-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  backend-data:
  mysql-data:
  redis-data:
